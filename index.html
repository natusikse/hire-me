
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hire Nataliia Evseeva</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f5eaff, #fff8f4);
      color: #171a3b;
      text-align: center;
      overflow: hidden;
    }

    main { padding: 25px; }

    h1 { font-size: clamp(36px, 6vw, 65px); }

    p { color: #626782; font-size: 19px; }

    .buttons {
      margin-top: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    button {
      padding: 20px 28px;
      border: none;
      border-radius: 18px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #hire {
      background: #8b70ef;
      color: white;
      box-shadow: 0 10px 25px #8b70ef55;
    }

    #hire:hover { background: #7355df; }

    #nohire {
      background: #ffe1e9;
      color: #ad3655;
      border: 2px solid #f3a1b8;
      transition: left .15s, top .15s;
    }
    
.achievement-container {
  margin: 30px auto;
  text-align: center;
}

.achievement-label {
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 3px;
  color: #8b70ef;
}

.achievement-window {
  margin: 16px auto;
  max-width: 650px;
  min-height: 75px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 15px 25px;
  border-radius: 20px;
  background: rgba(255,255,255,0.55);
  box-shadow: 0 8px 30px rgba(139,112,239,0.12);
  overflow: hidden;
}

#achievement-text {
  font-size: clamp(16px, 2.5vw, 23px);
  font-weight: bold;
  color: #171a3b;
  transition: opacity .25s, transform .25s;
}

#achievement-text.changing {
  opacity: 0;
  transform: translateY(-20px);
}

  </style>
</head>
<body>
  <main>
    <h1>Nataliia Evseeva</h1>
    <p>All-Russian Programming Olymdiad Absolute Winner; OVGU University Sudent; Ex-Assistant in American University</p>
    <h2>The easiest hiring decision you'll ever make.</h2>

    <div class="buttons">
      <button id="hire" onclick="hireMe()">
        Take Nataliia Evseeva
        <br>
        <small>(the best candidate for Data Tech and Innovation Internship)</small>
      </button>

      <button id="nohire">
        Do not hire Nataliia Evseeva 🏃
      </button>
    </div>
    
<section class="meme-section">

  <div class="meme-card">
    <img
      src="meme.png"
    >
  </div>

  <p class="meme-caption">
    Choose wisely, Deutsche Bank. 💌
  </p>
</section>

  </main>

  <script>
    function hireMe() {
      const email = "nevseevadm@gmail.com";
      const subject = "Congratulations! You're hired!";
      const body = "Dear Nataliia,%0A%0AWe would love to discuss your internship application!";
      const url = "https://mail.google.com/mail/?view=cm&fs=1&to="
        + encodeURIComponent(email)
        + "&su=" + encodeURIComponent(subject)
        + "&body=" + body;
      window.open(url, "_blank");
    }

    const no = document.getElementById("nohire");

    function runAway() {
      const rect = no.getBoundingClientRect();
      const margin = 12;
      const maxX = Math.max(margin, window.innerWidth - rect.width - margin);
      const maxY = Math.max(margin, window.innerHeight - rect.height - margin);

      no.style.position = "fixed";
      no.style.left = (margin + Math.random() * (maxX - margin)) + "px";
      no.style.top = (margin + Math.random() * (maxY - margin)) + "px";
      no.style.zIndex = "10";
    }

    no.addEventListener("mouseenter", runAway);
    no.addEventListener("touchstart", e => {
      e.preventDefault();
      runAway();
    }, { passive: false });
    no.addEventListener("click", runAway);
    
const achievements = [
  "🏆 All-Russian Programming Olympiad Winner",
  "🎓 Computer Science Student at OVGU",
  "👩‍🏫 Former Teaching Assistant at AUBG",
  "💻 Python · Java · C++ · SQL",
  "🧠 Data Mining & Recommender Systems",
  "✨ Your Future Data & Innovation Intern"
];

let achievementIndex = 0;
const achievementText =
  document.getElementById("achievement-text");

setInterval(() => {
  achievementText.classList.add("changing");

  setTimeout(() => {
    achievementIndex =
      (achievementIndex + 1) % achievements.length;

    achievementText.textContent =
      achievements[achievementIndex];

    achievementText.classList.remove("changing");
  }, 250);
}, 2200);

  </script>
</body>
</html>
